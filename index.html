<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Control de asistencia de EduGest">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#022451">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>EduGest · Asistencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Fija el tema antes de pintar para evitar un parpadeo (ver src/composables/useTema.js).
      (function () {
        var tema = null
        try { tema = localStorage.getItem('tema') } catch (e) {}
        if (tema !== 'light' && tema !== 'dark') {
          tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = tema
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
